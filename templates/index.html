*{margin:0;padding:0;box-sizing:border-box;transition:all .3s cubic-bezier(.4,0,.2,1)}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',Arial;margin:0;background:#0f172a;color:white;text-align:center;overflow-x:hidden;-webkit-font-smoothing:antialiased}
header{padding:80px 20px;background:linear-gradient(135deg,#2563eb,#7c3aed,#2563eb);background-size:200% 200%;animation:grad 8s ease infinite;position:relative;overflow:hidden}
@keyframes grad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
header::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.1),transparent 70%);pointer-events:none}
h1{font-size:56px;margin:0;font-weight:900;letter-spacing:-1px;text-shadow:0 4px 20px rgba(0,0,0,.3);animation:fadeUp 1s ease}
p{font-size:20px;opacity:.9;animation:fadeUp 1s ease .2s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.btn{display:inline-block;margin-top:30px;padding:16px 40px;background:white;color:#2563eb;border-radius:50px;text-decoration:none;font-weight:800;font-size:18px;box-shadow:0 10px 30px rgba(0,0,0,.3);position:relative;z-index:1;animation:fadeUp 1s ease .4s both}

.btn:active{transform:translateY(0) scale(.98)}
.cards{display:flex;gap:25px;justify-content:center;padding:60px 20px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.card{background:rgba(30,41,59,.8);backdrop-filter:blur(10px);padding:35px 30px;border-radius:20px;width:280px;border:1px solid rgba(255,255,255,.1);animation:fadeUp .8s ease both;cursor:pointer}
.card:nth-child(1){animation-delay:.5s}.card:nth-child(2){animation-delay:.7s}.card:nth-child(3){animation-delay:.9s}
.card:hover{transform:translateY(-10px);background:#1e293b;border-color:#3b82f6;box-shadow:0 20px 40px rgba(59,130,246,.3)}
.card h3{font-size:24px;margin-bottom:15px}
.card p{font-size:17px;opacity:.8}
.whatsapp{position:fixed;bottom:25px;left:25px;background:#25D366;color:white;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;text-decoration:none;box-shadow:0 10px 25px rgba(0,0,0,.4);z-index:1000}
.whatsapp:hover{transform:scale(1.1) rotate(10deg)}
@media(max-width:768px){h1{font-size:38px}.cards{padding:40px 15px}}
